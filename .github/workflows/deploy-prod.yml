name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Unity Catalog: crear catalog y schemas en prod
  # Prerrequisitos (one-time manual, Account Admin):
  #   - Metastore adjuntado al workspace prod
  #   - Storage Credential sc-liga1-poc-prod creado
  #   - External Location ext-loc-liga1prod creado
  # ═══════════════════════════════════════════════════════════
  setup-unity-catalog:
    name: Setup Unity Catalog prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear catalog prod_liga1_poc y schemas
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          python3 - << 'PYEOF'
          import requests, os, time, sys

          host    = os.environ["DATABRICKS_HOST"].rstrip("/")
          token   = os.environ["DATABRICKS_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # Usar el Serverless Starter Warehouse (viene por defecto en todo workspace)
          r = requests.get(f"{host}/api/2.0/sql/warehouses", headers=headers)
          warehouses = r.json().get("warehouses", [])
          if not warehouses:
              print("❌ No hay SQL Warehouse disponible en el workspace prod")
              sys.exit(1)
          wh_id = warehouses[0]["id"]
          print(f"✅ Usando warehouse: {warehouses[0]['name']} (id={wh_id})")

          stmts = [
              "CREATE CATALOG IF NOT EXISTS prod_liga1_poc MANAGED LOCATION 'abfss://liga1prod@datalakelig1prod.dfs.core.windows.net/dlt-poc/prod'",
              "CREATE SCHEMA IF NOT EXISTS prod_liga1_poc.bronze",
              "CREATE SCHEMA IF NOT EXISTS prod_liga1_poc.silver",
              "CREATE SCHEMA IF NOT EXISTS prod_liga1_poc.gold",
          ]

          def run_stmt(stmt):
              r = requests.post(
                  f"{host}/api/2.0/sql/statements", headers=headers,
                  json={"statement": stmt, "warehouse_id": wh_id, "wait_timeout": "30s"}
              )
              resp  = r.json()
              state = resp.get("status", {}).get("state", "?")
              if state == "PENDING":
                  stmt_id = resp.get("statement_id")
                  for _ in range(12):
                      time.sleep(5)
                      r2    = requests.get(f"{host}/api/2.0/sql/statements/{stmt_id}", headers=headers)
                      state = r2.json().get("status", {}).get("state", "?")
                      if state != "PENDING":
                          break
              err = resp.get("status", {}).get("error", {}).get("message", "")
              return state, err

          for stmt in stmts:
              state, err = run_stmt(stmt)
              if state == "SUCCEEDED":
                  print(f"  ✅ {stmt[:90]}")
              else:
                  print(f"  ❌ [{state}] {stmt[:90]}")
                  if err: print(f"     {err}")
                  sys.exit(1)

          print("\n✅ Catalog prod_liga1_poc y schemas bronze/silver/gold listos")
          PYEOF

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — DAB: desplegar el bundle al workspace prod
  # Sube los notebooks y crea el pipeline DLT con variables prod:
  #   catalog = prod_liga1_poc
  #   adls_landing_path = abfss://liga1prod@datalakelig1prod...
  # DAB toma el workspace de la env var DATABRICKS_HOST_PROD
  # ═══════════════════════════════════════════════════════════
  deploy-bundle:
    name: Deploy bundle → workspace prod
    runs-on: ubuntu-latest
    needs: [setup-unity-catalog]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle a prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle deploy --target prod
