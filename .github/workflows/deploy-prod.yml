name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — Unity Catalog: crear catalog y schemas en prod
  # Prerrequisitos (one-time manual, Account Admin):
  #   - Metastore adjuntado al workspace prod
  #   - Storage Credential sc-liga1-poc-prod creado
  #   - External Location ext-loc-liga1prod creado
  # ═══════════════════════════════════════════════════════════
  setup-unity-catalog:
    name: Setup Unity Catalog prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear catalog prod_liga1_poc y schemas
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: |
          python3 - << 'PYEOF'
          import requests, os, sys

          host    = os.environ["DATABRICKS_HOST"].rstrip("/")
          token   = os.environ["DATABRICKS_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          print(f"Workspace: {host}")

          # ── Verificar conectividad ────────────────────────────────────────────
          r = requests.get(f"{host}/api/2.0/preview/scim/v2/Me", headers=headers)
          if r.status_code != 200:
              print(f"❌ No se puede conectar al workspace: {r.status_code} {r.text}")
              sys.exit(1)
          me = r.json()
          print(f"✅ Conectado como: {me.get('userName', me.get('displayName', '?'))}")

          # ── Crear catalog via Unity Catalog REST API (no necesita warehouse) ──
          # 409 = ya existe → idempotente, no es error
          r = requests.post(
              f"{host}/api/2.1/unity-catalog/catalogs",
              headers=headers,
              json={
                  "name": "prod_liga1_poc",
                  "storage_root": "abfss://liga1prod@datalakelig1prod.dfs.core.windows.net/dlt-poc/prod",
                  "comment": "Catalog produccion Liga1 DLT POC"
              }
          )
          if r.status_code in (200, 201):
              print("✅ Catalog prod_liga1_poc creado")
          elif r.status_code in (400, 409) and "ALREADY_EXISTS" in r.text:
              print("✅ Catalog prod_liga1_poc ya existe")
          else:
              print(f"❌ Error creando catalog: {r.status_code}")
              print(r.text)
              sys.exit(1)

          # ── Crear schemas bronze / silver / gold ──────────────────────────────
          for schema in ["bronze", "silver", "gold"]:
              r = requests.post(
                  f"{host}/api/2.1/unity-catalog/schemas",
                  headers=headers,
                  json={
                      "name": schema,
                      "catalog_name": "prod_liga1_poc",
                      "comment": f"Capa {schema} Liga1 DLT POC"
                  }
              )
              if r.status_code in (200, 201):
                  print(f"✅ Schema prod_liga1_poc.{schema} creado")
              elif r.status_code in (400, 409) and "ALREADY_EXISTS" in r.text:
                  print(f"✅ Schema prod_liga1_poc.{schema} ya existe")
              else:
                  print(f"❌ Error creando schema {schema}: {r.status_code}")
                  print(r.text)
                  sys.exit(1)

          print("\n✅ Catalog prod_liga1_poc y schemas bronze/silver/gold listos")
          PYEOF

  # ═══════════════════════════════════════════════════════════
  # JOB 2 — DAB: desplegar el bundle al workspace prod
  # Sube los notebooks y crea el pipeline DLT con variables prod:
  #   catalog = prod_liga1_poc
  #   adls_landing_path = abfss://liga1prod@datalakelig1prod...
  # DAB toma el workspace de la env var DATABRICKS_HOST_PROD
  # ═══════════════════════════════════════════════════════════
  deploy-bundle:
    name: Deploy bundle → workspace prod
    runs-on: ubuntu-latest
    needs: [setup-unity-catalog]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle a prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle deploy --target prod

      - name: Ejecutar pipeline DLT prod
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle run liga1_dlt_pipeline --target prod
